                - id: vehicle_1
                  make: Tesla
                  model: Model 3
                  year: 2025
                  plateNumber: DEMO-101
                  active: true
                - id: vehicle_2
                  make: Jeep
                  model: Wrangler
                  year: 2025
                  plateNumber: DEMO-202
                  active: true
                - id: vehicle_3
                  make: Honda
                  model: Civic
                  year: 2025
                  plateNumber: DEMO-303
                  active: true
                - id: vehicle_4
                  make: Ford
                  model: Mustang
                  year: 2025
                  plateNumber: DEMO-404
                  active: false
      summary: List fleet vehicles
      tags:
        - Vehicles
  /api/availability:
    get:
      description: Generates candidate starts every 30 minutes, fitting the requested
        duration within 09:00–17:00. Occupied windows remain visible with
        available=false. Availability is a snapshot, not a reservation;
        creating/updating a booking always checks conflicts again.
      operationId: AvailabilityController_get
      parameters:
        - name: vehicleId
          required: true
          in: query
          description: An existing active vehicle.
          schema:
            pattern: ^[a-zA-Z0-9_-]{1,80}$
            example: vehicle_1
            type: string
        - name: date
          required: true
          in: query
          description: Plain local calendar date (YYYY-MM-DD). Scheduling and availability
            require today or later; replace example dates before trying
            requests.
          schema:
            format: date
            pattern: ^\d{4}-\d{2}-\d{2}$
            example: 2026-10-10
            type: string
        - name: durationMinutes
          required: true
          in: query
          description: Operation duration in minutes.
          schema:
            minimum: 30
            maximum: 240
            multipleOf: 30
            example: 60
            type: integer
        - name: excludeBookingId
          required: false
          in: query
          description: Existing booking to exclude when editing, so its current window
            stays available.
          schema:
            pattern: ^[a-zA-Z0-9_-]{1,80}$
            example: booking_1
            type: string
      responses:
        "200":
          description: All candidate windows, including occupied windows.
