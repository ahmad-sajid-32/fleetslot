                    endTime: 11:30
                    available: false
                  - startTime: 11:00
                    endTime: 12:00
                    available: true
                  - startTime: 11:30
                    endTime: 12:30
                    available: true
                  - startTime: 12:00
                    endTime: 13:00
                    available: true
                  - startTime: 12:30
                    endTime: 13:30
                    available: true
                  - startTime: 13:00
                    endTime: 14:00
                    available: true
                  - startTime: 13:30
                    endTime: 14:30
                    available: true
