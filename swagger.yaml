info:
  title: FleetSlot API
  description: Fleet turnaround and vehicle operations scheduling. In-memory
    fictional data resets on backend restart. Dates use the operator/server
    local calendar; replace example dates with today or a future date before
    scheduling. No authentication is required for this demo.
  version: 1.0.0
  contact: {}
tags:
  - name: Vehicles
    description: Fictional fleet and active state
  - name: Bookings
    description: Schedule, read, edit, and delete operations
  - name: Availability
    description: Generated vehicle-specific windows
servers:
  - url: /
    description: Current host (API or frontend proxy)
components:
  schemas:
    VehicleResponseDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
          example: vehicle_1
        make:
          type: string
          example: Tesla
        model:
          type: string
          example: Model 3
        year:
          type: integer
          example: 2025
        plateNumber:
          type: string
          example: DEMO-101
        active:
          type: boolean
          example: true
          description: Inactive vehicles remain readable but cannot be scheduled.
      required:
        - id
        - make
        - model
        - year
        - plateNumber
        - active
    ApiErrorResponseDto:
      type: object
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - PAST_DATE
            - INVALID_SLOT
            - INVALID_DURATION
            - OUTSIDE_WORKING_HOURS
            - VEHICLE_NOT_FOUND
            - BOOKING_NOT_FOUND
            - VEHICLE_INACTIVE
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid request fields. Check required values and supported formats.
      required:
        - code
        - message
    TimeWindowDto:
      type: object
      properties:
        startTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 10:00
          description: Local HH:mm time, aligned to 30-minute starts. The whole operation
            must fit within 09:00–17:00.
        endTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 11:00
          description: Derived local end time. Never submitted or persisted as a booking
            field.
      required:
        - startTime
        - endTime
    BookingConflictResponseDto:
      type: object
      properties:
        code:
          type: string
          enum:
            - BOOKING_CONFLICT
        message:
          type: string
          example: This vehicle is unavailable for the requested window.
        suggestions:
          maxItems: 3
          description: Same vehicle, date, and duration. Later starts ascending, then
            earlier starts descending. May be empty when the day is fully
            booked.
          type: array
          items:
            $ref: "#/components/schemas/TimeWindowDto"
      required:
        - code
        - message
        - suggestions
    AvailabilitySlotDto:
      type: object
      properties:
        startTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 10:00
          description: Local HH:mm time, aligned to 30-minute starts. The whole operation
            must fit within 09:00–17:00.
        endTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 11:00
          description: Derived local end time. Never submitted or persisted as a booking
            field.
        available:
          type: boolean
          example: true
          description: False windows remain in the response so occupied times can be
            displayed.
      required:
        - startTime
        - endTime
        - available
    AvailabilityResponseDto:
      type: object
      properties:
        vehicleId:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
          example: vehicle_1
        date:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: 2026-10-10
          description: Plain local calendar date (YYYY-MM-DD). Scheduling and availability
            require today or later; replace example dates before trying
            requests.
        durationMinutes:
          type: integer
          minimum: 30
          maximum: 240
          multipleOf: 30
          example: 60
          description: Operation duration in minutes.
        slots:
          description: Generated windows in ascending start order, entirely within working
            hours.
          type: array
          items:
            $ref: "#/components/schemas/AvailabilitySlotDto"
      required:
        - vehicleId
        - date
        - durationMinutes
        - slots
    BookingType:
      type: string
      enum:
        - PICKUP_HANDOFF
        - RETURN_HANDOFF
        - INSPECTION
        - CLEANING
        - MAINTENANCE
    CreateBookingDto:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          example: Interior cleaning
          description: Trimmed before validation; cannot be blank.
        description:
          type: string
          maxLength: 1000
          example: Prepare for the next handoff.
          description: Optional notes. On update, omit to preserve notes or send an empty
            string to clear them; null is not accepted.
        type:
          example: CLEANING
          allOf:
            - $ref: "#/components/schemas/BookingType"
        date:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: 2026-10-10
          description: Plain local calendar date (YYYY-MM-DD). Scheduling and availability
            require today or later; replace example dates before trying
            requests.
        startTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 10:00
          description: Local HH:mm time, aligned to 30-minute starts. The whole operation
            must fit within 09:00–17:00.
        durationMinutes:
          type: integer
          minimum: 30
          maximum: 240
          multipleOf: 30
          example: 60
          description: Operation duration in minutes.
        vehicleId:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,80}$
          example: vehicle_1
          description: Vehicle ID. Creating or updating a booking requires an active
            vehicle.
      required:
        - title
        - type
        - date
        - startTime
        - durationMinutes
        - vehicleId
      additionalProperties: false
    UpdateBookingDto:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          example: Interior cleaning
